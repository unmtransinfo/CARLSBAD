name: Publish Docker Image

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    name: Build & Push UI Image
    runs-on: ubuntu-latest
    env:
      LIBS_TGZ_BASE64: ${{ secrets.LIBS_TGZ_BASE64 }}
      LIBS_DOWNLOAD_URL: ${{ secrets.LIBS_DOWNLOAD_URL }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Step to restore untracked proprietary dependencies ---
      - name: Restore Proprietary Dependencies (Base64)
        if: ${{ env.LIBS_TGZ_BASE64 != '' }}
        run: |
          echo "Restoring libs/ folder from LIBS_TGZ_BASE64 secret..."
          echo "$LIBS_TGZ_BASE64" | base64 --decode | tar -xzf -

      - name: Restore Proprietary Dependencies (Signed URL)
        if: ${{ env.LIBS_DOWNLOAD_URL != '' && env.LIBS_TGZ_BASE64 == '' }}
        run: |
          echo "Downloading libs/ archive from LIBS_DOWNLOAD_URL secret..."
          curl -sSL -o libs.tar.gz "$LIBS_DOWNLOAD_URL"
          tar -xzf libs.tar.gz
          rm -f libs.tar.gz

      - name: Check libs/ Directory Structure
        run: |
          echo "=== CI Dependency Restoration Diagnostics ==="
          echo "LIBS_TGZ_BASE64 secret length: ${#LIBS_TGZ_BASE64} characters"
          echo "LIBS_DOWNLOAD_URL secret length: ${#LIBS_DOWNLOAD_URL} characters"
          echo "============================================="
          
          if [ -d "libs" ]; then
            echo "SUCCESS: libs/ directory successfully restored."
            echo "Number of files in libs/:"
            ls -1 libs/ | wc -l
          else
            echo "ERROR: libs/ directory not found!"
            echo "This repository requires proprietary dependencies to build."
            echo "Please ensure you have configured either the LIBS_TGZ_BASE64 or LIBS_DOWNLOAD_URL repository secret in GitHub Settings (Settings > Secrets and variables > Actions)."
            echo "Refer to the README.md file under 'GitHub Actions CI/CD' for detailed setup instructions."
            exit 1
          fi

      # --- Set up Docker Buildx ---
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Log in to Docker Hub ---
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- Build and Push ---
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            unmtransinfo/carlsbad_ui:latest
            unmtransinfo/carlsbad_ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
